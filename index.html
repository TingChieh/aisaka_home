<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aisaka.cc</title>
<meta name="description" content="aisaka.cc 下的全部站点">
<meta name="theme-color" content="#12392a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2312392a'/><circle cx='16' cy='21' r='5' fill='%23f2c230'/></svg>">
<link rel="preload" href="fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Barlow Condensed"; font-weight: 600; font-display: swap;
    src: url(fonts/barlow-condensed-600.woff2) format("woff2");
  }
  /* 叮叮车绿 + 路牌黄 */
  :root {
    --green: #12392a; --paper: #e4eadf; --moss: #8fa596; --signal: #f2c230;
    --big: clamp(4rem, min(10vw, 14vh), 8rem);
    --axis: 42%;
    --sign: "Barlow Condensed", "Arial Narrow", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--green); color: var(--paper); }
  body { position: relative; margin: 0; min-height: 100vh; display: flex; align-items: center;
         font: 16px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  main { width: 100%; padding: 2vh 16px max(8vh, 5rem); }
  footer { position: absolute; right: max(24px, env(safe-area-inset-right));
           bottom: max(16px, env(safe-area-inset-bottom)); }
  footer a { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px;
             color: var(--moss); text-decoration: none; border-radius: 3px; }
  footer svg { width: 22px; height: 22px; fill: currentColor; }
  footer a:hover, footer a:focus-visible { color: var(--signal); }
  footer a:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  .board { position: relative; max-width: 1100px; margin: 0 auto; }
  .heading { display: flex; justify-content: space-between; align-items: baseline;
             margin-bottom: clamp(2rem, 5vw, 4rem); color: var(--moss);
             font-size: .75rem; letter-spacing: .12em; }
  .heading strong { color: var(--paper); font: 600 1.15rem/1 var(--sign); letter-spacing: .08em; }
  .board ul { list-style: none; margin: 0; padding: 0; width: var(--axis); text-align: right;
              font-family: var(--sign); font-weight: 600; }
  .board a { display: inline-block; font-size: var(--big); line-height: 1; letter-spacing: -.005em;
             color: var(--moss); text-decoration: none; border-radius: 3px; transition: color .25s ease; }
  .board a.on { color: var(--paper); }
  .board a:focus-visible { outline: 3px solid var(--signal); outline-offset: 4px; }
  .board li.ops a { font-size: calc(var(--big) * .45); }
  .board li.ops-start { margin-top: calc(var(--big) * .4); }
  .board a .s { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .board a .d { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* 只写一次的后缀：跟着当前那一行走，末尾略微冲过头再回位，像牌子卡进槽里 */
  .tail, .note { position: absolute; top: 0; left: var(--axis); pointer-events: none; }
  .tail { font: 600 var(--big)/1 var(--sign); letter-spacing: -.005em; color: var(--signal);
          transform-origin: 0 100%; white-space: nowrap;
          transition: transform .4s cubic-bezier(.3, 1.25, .5, 1), opacity .45s ease; }
  .note { padding: .9rem 0 0 .2rem; color: var(--moss); font-size: 1.35rem; letter-spacing: .02em;
          transition: opacity .22s ease; }
  .note.out { opacity: 0; transition-duration: .1s; }

  /* 开场：后缀先单独停在中间，列表亮起，后缀再落到第一行 */
  .board ul { transition: opacity .6s ease; }
  .board.pre-tail .tail, .board.pre-tail .note { opacity: 0; }
  .board.pre-list ul { opacity: 0; }

  @media (max-width: 760px), (hover: none) {
    :root { --big: clamp(2.75rem, 14vw, 4.5rem); }
    main { padding: 10vh 16px max(14vh, 5rem); }
    footer { right: max(16px, env(safe-area-inset-right)); }
    .tail, .note { display: none; }
    .board ul { width: auto; text-align: left; }
    .heading { margin-bottom: 2.5rem; }
    .board li { margin-bottom: .9rem; }
    .board li.ops-start { margin-top: 1.6rem; }
    .board a, .board a.on { color: var(--paper); }
    .board a .s { position: static; width: auto; height: auto; overflow: visible; clip: auto;
                  font-size: .5em; color: var(--signal); }
    .board a .d { position: static; display: block; width: auto; height: auto; overflow: visible; clip: auto;
                  font: 15px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
                  color: var(--moss); margin-top: .2rem; }
  }
  @media (prefers-reduced-motion: reduce) { .tail, .note, .board a, .board ul { transition: none; } }
</style>
</head>
<body>
<main>
  <h1 class="sr">aisaka.cc 站点导航</h1>
  <nav class="board" id="board">
    <div class="heading" aria-hidden="true"><strong>AISAKA.CC</strong><span>个人站点索引</span></div>
    <ul>
      <li><a class="on" href="https://blog.aisaka.cc"><span class="p">blog</span><span class="s">.aisaka.cc</span><span class="d">文章和播客</span></a></li>
      <li><a href="https://run.aisaka.cc"><span class="p">run</span><span class="s">.aisaka.cc</span><span class="d">跑步记录和数据</span></a></li>
      <li><a href="https://slides.aisaka.cc"><span class="p">slides</span><span class="s">.aisaka.cc</span><span class="d">幻灯片与演示</span></a></li>
      <li><a href="https://cloud.aisaka.cc"><span class="p">cloud</span><span class="s">.aisaka.cc</span><span class="d">云盘与文件</span></a></li>
      <li class="ops ops-start"><a href="https://status.aisaka.cc"><span class="p">status</span><span class="s">.aisaka.cc</span><span class="d">服务器实时状态</span></a></li>
      <li class="ops"><a href="https://monitor.aisaka.cc"><span class="p">monitor</span><span class="s">.aisaka.cc</span><span class="d">各站点是否在线</span></a></li>
    </ul>
    <div class="tail" id="tail" aria-hidden="true">.aisaka.cc</div>
    <div class="note" id="note" aria-hidden="true">文章和播客</div>
  </nav>
</main>
<footer>
  <a href="https://github.com/TingChieh" aria-label="TingChieh 的 GitHub 主页" title="GitHub · TingChieh">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 .297C5.37.297 0 5.67 0 12.297c0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.043-1.61-4.043-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.838 1.237 1.838 1.237 1.07 1.835 2.807 1.305 3.492.998.108-.776.418-1.305.762-1.605-2.665-.305-5.467-1.334-5.467-5.93 0-1.31.468-2.382 1.235-3.222-.123-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23a11.52 11.52 0 0 1 3.003-.404c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.652.241 2.873.118 3.176.77.84 1.233 1.912 1.233 3.222 0 4.61-2.807 5.622-5.479 5.921.43.372.823 1.102.823 2.222 0 1.606-.015 2.898-.015 3.293 0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
  </a>
</footer>
<script>
(function () {
  var board = document.getElementById("board"), tail = document.getElementById("tail"),
      note = document.getElementById("note"), links = board.querySelectorAll("a"), current = links[0],
      still = matchMedia("(prefers-reduced-motion: reduce)").matches,
      wide = getComputedStyle(tail).display !== "none",
      lastY = 0, timer;

  function moveTail(x, y, scale, ms) {
    tail.style.transitionDuration = ms + "ms, .45s";
    tail.style.transform = "translate(" + x + "px, " + y + "px) scale(" + scale + ")";
    lastY = y;
  }

  // ms 省略时按距离算：离得越远滑得越久；重复指向同一行不做事
  function place(a, ms) {
    if (a === current && ms === undefined) return;
    current.classList.remove("on");
    current = a; a.classList.add("on");
    var bottom = a.offsetTop + a.offsetHeight, y = bottom - tail.offsetHeight;
    if (ms === undefined) ms = still ? 0 : Math.min(260 + Math.abs(y - lastY) * .35, 560);
    moveTail(0, y, a.offsetHeight / tail.offsetHeight, ms);
    // 说明先淡出，后缀快到位时再在新位置淡入；快速扫过时只在停下的那行出现
    clearTimeout(timer);
    note.classList.add("out");
    timer = setTimeout(function () {
      note.textContent = a.querySelector(".d").textContent;
      note.style.transform = "translateY(" + bottom + "px)";
      note.classList.remove("out");
    }, ms * .6);
  }
  links.forEach(function (a) {
    a.addEventListener("mouseenter", function () { place(a); });
    a.addEventListener("focus", function () { place(a); });
  });
  window.addEventListener("resize", function () { place(current, 0); });

  function intro() {
    if (!wide || still) { board.classList.remove("pre-tail", "pre-list"); place(current, 0); return; }
    // 列表先亮起，后缀从右边滑进来接到第一行后面
    moveTail(tail.offsetHeight * .6, current.offsetTop + current.offsetHeight - tail.offsetHeight, 1, 0);
    tail.offsetWidth;
    board.classList.remove("pre-list");
    setTimeout(function () { board.classList.remove("pre-tail"); place(current, 700); }, 350);
  }
  if (wide && !still) { board.classList.add("pre-tail", "pre-list"); note.classList.add("out"); }
  var fonts = document.fonts ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(function (r) { setTimeout(r, 800); })]).then(intro);
})();
</script>
</body>
</html>
